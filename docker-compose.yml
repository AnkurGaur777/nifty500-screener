services:
  postgres:
    image: postgres:16-alpine
    container_name: nifty500_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: unless-stopped

volumes:
  pgdata:
